<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Africa Fintech Inside</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h1>AFI Dashboard</h1>
        <p class="subtitle">Connecte-toi pour accéder à ton espace membre.</p>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Identifiant</label>
                <input type="text" id="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <p class="form-error" id="login-error"></p>
            <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
        </form>

        <p class="form-switch">Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
    </div>

    <script src="../js/loginApp.js"></script>
</body>
</html>
