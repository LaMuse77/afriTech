<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — Africa Fintech Inside</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h1>Créer un compte</h1>
        <p class="subtitle">Rejoins l'espace membre Africa Fintech Inside.</p>

        <form id="register-form">
            <div class="form-group">
                <label for="username">Identifiant</label>
                <input type="text" id="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="first_name">Prénom</label>
                <input type="text" id="first_name" autocomplete="given-name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" autocomplete="new-password" required>
            </div>
            <p class="form-error" id="register-error"></p>
            <button type="submit" class="btn btn-primary btn-block">Créer mon compte</button>
        </form>

        <p class="form-switch">Déjà membre ? <a href="login.html">Se connecter</a></p>
    </div>

    <script src="../js/registerApp.js"></script>
</body>
</html>
