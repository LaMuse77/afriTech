services:
  - type: web
    name: afritech
    runtime: python
    buildCommand: ./build.sh
    startCommand: cd src/fin && gunicorn fin.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      - key: SECRET_KEY
        sync: false

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "afritech.onrender.com"

      - key: DATABASE_URL
        sync: false

      - key: YOUTUBE_API_KEY
        sync: false

      - key: YOUTUBE_CHANNEL_ID
        sync: false

      - key: MIXPANEL_PROJECT_ID
        sync: false

      - key: MIXPANEL_SERVICE_ACCOUNT_USERNAME
        sync: false

      - key: MIXPANEL_SERVICE_ACCOUNT_SECRET
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://afritech.onrender.com"

      - key: CORS_ALLOWED_ORIGINS
        value: "https://afritech.onrender.com"